<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCN Clicker</title>
</head>
<body>
    <button id="toggleButton">Toggle Script</button>
    <script>
        document.getElementById('toggleButton').addEventListener('click', function() {
            chrome.runtime.sendMessage({ action: "toggleScript" });
        });
    </script>
</body>
</html>
